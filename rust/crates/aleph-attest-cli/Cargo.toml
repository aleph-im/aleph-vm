[package]
name = "aleph-attest-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aleph-tee = { path = "../aleph-tee" }
rustls.workspace = true
x509-parser.workspace = true
reqwest.workspace = true
tokio.workspace = true
hex.workspace = true
# Owner signing key for `inject-secret --owner-key`; must be the same k256 as
# aleph-tee::owner_auth so the SigningKey type matches across the boundary.
k256.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
getrandom = "0.2"
url = "2"

[dev-dependencies]
rcgen.workspace = true
sha2.workspace = true
# Test-only: build real 1184-byte SEV-SNP report blobs (sev), hand-craft cert
# extension payloads with smuggled unsigned fields (der), and stand up a local
# attested-TLS server to prove secrets are never transmitted before the AMD
# chain verifies (tokio-rustls + tokio io-util).
sev.workspace = true
der.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { workspace = true, features = ["io-util"] }
