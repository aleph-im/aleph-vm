[package]
name = "supervisor-controller"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust per-VM controller: reads a {vm_hash}-controller.json and runs the QEMU process (non-confidential parity with the Python QemuVM)"

[[bin]]
name = "aleph-vm-controller"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Byte-parity ORACLE for the SEV-SNP TEE argv fragment only (increment B1).
# aleph-tee is a DEV dependency, never a runtime one: the controller's runtime
# SNP fragment is self-contained (`qemu::snp_tee_fragment`) precisely so the
# controller binary does not pull aleph-tee's openssl/reqwest closure.
aleph-tee = { path = "../aleph-tee" }
