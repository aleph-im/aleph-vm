[package]
name = "aleph-attest-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aleph-im/aleph-vm"
description = "In-guest attested-TLS HTTPS sidecar: key-bound SEV-SNP report embedded in a self-signed cert, fresh-attestation and one-shot secret-injection endpoints, reverse proxy to the workload"

# Own workspace (excluded from ../../Cargo.toml): this crate is the binary
# baked into the measured SEV-SNP initrd. Its Cargo.lock pins the measured
# dependency set independently of the supervisor workspace, so a dependency
# bump there never changes the launch measurement, and a bump HERE is a
# deliberate, reviewable change to the guest TCB (re-seed
# nix/golden-measurements.json in the same PR). Versions below mirror the
# root [workspace.dependencies] pins; aleph-tee (path dep) keeps inheriting
# from the root manifest, which cargo resolves even when the other root
# members are absent from the tree (the nix build ships only the root
# Cargo.toml, aleph-tee and this crate).
[workspace]

[dependencies]
aleph-tee = { path = "../aleph-tee" }
actix-web = { version = "4", features = ["rustls-0_23"] }
# rustls provider reconciliation, same pin as the root workspace: default
# features OFF and only the ring provider enabled, so aws-lc-rs never enters
# this tree (see the root Cargo.toml comment). tls.rs installs the ring
# CryptoProvider by name.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "sync", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
hex = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
# Constructs valid/invalid owner-signed envelopes in the inject-secret tests.
k256 = { version = "0.13", features = ["ecdsa"] }
