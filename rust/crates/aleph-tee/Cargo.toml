[package]
name = "aleph-tee"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AMD SEV-SNP and Intel TDX attestation library: report and quote generation/parsing, AMD KDS and Intel DCAP collateral verification, QEMU arg generation, and attestation-embedded X.509"

[dependencies]
sev.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
ring.workspace = true
der.workspace = true
hex.workspace = true
sha2.workspace = true
sha3.workspace = true
k256.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# Runtime for the #[ignore]d network tests that check the pinned AMD and
# Intel roots against what the vendors currently serve. Offline `cargo test`
# never runs them.
tokio = { workspace = true }
# Absolute validity windows for fabricated test certificates.
time = { workspace = true }
tempfile = { workspace = true }
