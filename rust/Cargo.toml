[workspace]
resolver = "2"
members = [
    "crates/supervisor-proto",
    "crates/supervisor-daemon",
    "crates/supervisor-controller",
    "crates/supervisor-cli",
    "crates/aleph-tee",
]
# aleph-attest-agent is its own workspace with its own Cargo.lock: it is the
# binary baked into the measured SEV-SNP initrd, so its dependency set must
# only move when deliberately bumped there, never as a side effect of a
# supervisor-side `cargo update`. It still depends on crates/aleph-tee by
# path (compiled under the agent's lock). Build/lint it with
# `cargo <cmd> --manifest-path crates/aleph-attest-agent/Cargo.toml`.
exclude = ["crates/aleph-attest-agent"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/aleph-im/aleph-vm"

[workspace.dependencies]
supervisor-proto = { path = "crates/supervisor-proto" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# type-safe memory-size newtypes (aleph-rs). MiB is a u64 newtype that
# deserializes only from a bare integer, so serde itself rejects a
# float/negative/string mem_size_mb.
memsizes = { version = "1", features = ["serde"] }
prost = "0.13"
# msgpack shape validation only (Python msgpack.unpackb parity); validated
# payloads are still forwarded as the client's raw bytes, never re-encoded.
rmpv = "1"
# bundled: link a vendored libsqlite3 so cargo builds and tests are hermetic
# (no libsqlite3-dev needed on CI runners or in build containers). The
# on-disk format is plain sqlite3, shared with SQLAlchemy.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zbus = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "sync", "process", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
tonic-build = "0.12"
tracing = "0.1"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# test-only
hyper-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# aleph-tee (B0): SEV-SNP attestation stack ported from aleph-cvm.
# Versions reconciled with the aleph-cvm donor workspace. reqwest uses the
# rustls-tls backend (matching the donor) so the crate's AMD KDS fetches do not
# pull system OpenSSL for TLS transport; the openssl crate is still needed for
# the report/cert cryptographic verification (ECDSA-P384, X.509 chain checks).
sev = { version = "7", features = ["snp", "openssl"] }
rcgen = "0.14"
x509-parser = "0.16"
# alloc: needed for der::Encode::to_der (returns Vec<u8>); the donor workspace
# got this feature transitively via x509-cert, which we do not port here.
der = { version = "0.7", features = ["alloc"] }
openssl = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
# owner_auth: EIP-191 personal-sign over the owner-auth payload (secp256k1
# recoverable ECDSA signatures, Keccak256 for the Ethereum message digest and
# address derivation).
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

# aleph-attest-agent (B2a, now its own workspace under crates/aleph-attest-agent,
# which pins these same versions explicitly): in-guest attested-TLS HTTPS sidecar ported from
# aleph-cvm. actix-web serves the reverse proxy + attestation/inject-secret
# endpoints; the rustls-0_23 feature wires in tokio-rustls for bind_rustls_0_23.
actix-web = { version = "4", features = ["rustls-0_23"] }
# rustls provider reconciliation: default-features are OFF and only the ring
# provider is enabled (rustls' default features would additionally pull the
# aws_lc_rs provider and its aws-lc-sys C build). Declaring rustls directly at
# the workspace level like this unifies the whole tree onto ring: actix-web's
# rustls-0_23 (via tokio-rustls) and reqwest's rustls-tls both resolve to this
# same aws_lc_rs-free rustls, so aws-lc-rs never enters the dependency tree at
# all. This is stricter than the aleph-cvm donor (whose lock carried both ring
# and aws-lc-rs and disambiguated only at runtime); here ring is the sole
# provider present. tls.rs still installs the ring CryptoProvider by name.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
zeroize = { version = "1", features = ["derive"] }
