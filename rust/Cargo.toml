[workspace]
resolver = "2"
members = ["crates/supervisor-proto", "crates/supervisor-daemon"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/aleph-im/aleph-vm"

[workspace.dependencies]
supervisor-proto = { path = "crates/supervisor-proto" }

clap = { version = "4", features = ["derive"] }
libc = "0.2"
prost = "0.13"
# bundled: link a vendored libsqlite3 so cargo builds and tests are hermetic
# (no libsqlite3-dev needed on CI runners or in build containers). The
# on-disk format is plain sqlite3, shared with SQLAlchemy.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zbus = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
tonic-build = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# test-only
hyper-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
