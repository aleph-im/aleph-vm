[workspace]
resolver = "2"
members = [
    "crates/supervisor-proto",
    "crates/supervisor-daemon",
    "crates/supervisor-controller",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/aleph-im/aleph-vm"

[workspace.dependencies]
supervisor-proto = { path = "crates/supervisor-proto" }

clap = { version = "4", features = ["derive"] }
libc = "0.2"
prost = "0.13"
# msgpack shape validation only (Python msgpack.unpackb parity); validated
# payloads are still forwarded as the client's raw bytes, never re-encoded.
rmpv = "1"
# bundled: link a vendored libsqlite3 so cargo builds and tests are hermetic
# (no libsqlite3-dev needed on CI runners or in build containers). The
# on-disk format is plain sqlite3, shared with SQLAlchemy.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# backup archives (increment 5): the same uncompressed-tar + sha256 sidecar
# format the Python controller writes (aleph.vm.supervisor.controllers.qemu.backup).
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
zbus = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "sync", "process", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
tonic-build = "0.12"
tracing = "0.1"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# test-only
hyper-util = "0.1"
tower = { version = "0.5", features = ["util"] }
