---
name: "aleph-vm CodeQL config"

# Exclude non-shipped developer tooling from analysis. scripts/ holds codegen,
# bundle tooling and one-off diagnostics, none of which is imported by the
# runtime package or packaged. CodeQL taints hardcoded dummy SEV session/godh
# *paths* such tooling writes into fixtures as clear-text secrets
# (py/clear-text-{storage,logging}-sensitive-data); on fixture data that is a
# false positive. Dropping scripts/ from the analysis scope removes the noise
# without hiding any shipped code.
paths-ignore:
  - scripts
