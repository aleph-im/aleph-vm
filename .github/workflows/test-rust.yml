---
name: "Rust supervisor daemon"


on:
  push:
    branches: [main, dev]
    paths:
      - "rust/**"
      - "proto/**"
      - "tests/conformance/**"
      - "src/aleph/vm/supervisor_interface/**"
      - "src/aleph/vm/resources.py"
      - "src/aleph/vm/network/get_interface_ipv4.py"
      - "pyproject.toml"
      - ".github/workflows/test-rust.yml"
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main, dev]
    paths:
      - "rust/**"
      - "proto/**"
      - "tests/conformance/**"
      - "src/aleph/vm/supervisor_interface/**"
      - "src/aleph/vm/resources.py"
      - "src/aleph/vm/network/get_interface_ipv4.py"
      - "pyproject.toml"
      - ".github/workflows/test-rust.yml"


jobs:
  rust:
    name: "cargo fmt, clippy, test and Python conformance"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Workaround github issue https://github.com/actions/runner-images/issues/7192
        run: sudo echo RESET grub-efi/install_devices | sudo debconf-communicate grub-pc

      - name: Install protoc and lspci
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pciutils

      - name: Install the pinned Rust toolchain
        # rustup reads rust/rust-toolchain.toml when invoked from inside rust/.
        working-directory: rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test --locked

      # The conformance suite drives the compiled daemon with the production
      # Python client, so it needs the same Python setup as the pytest job.
      - name: Install required system packages for the Python conformance suite
        run: |
          sudo apt-get install -y python3 python3-pip python3-aiohttp python3-msgpack python3-aiodns python3-alembic python3-sqlalchemy python3-setproctitle redis python3-psutil python3-netifaces sudo acl curl systemd-container squashfs-tools debootstrap python3-packaging python3-cpuinfo python3-nftables python3-jsonschema nftables libsystemd-dev cmake libdbus-1-dev libglib2.0-dev lshw python3-jwcrypto

      - name: Install hatch
        run: |
          # virtualenv 21 brings a breaking change that's not supported by hatch 1.16
          python3 -m pip install --upgrade --ignore-installed hatch hatch-vcs coverage "virtualenv<21"

      - name: Run the conformance suite against the Rust daemon
        env:
          ALEPH_VM_CONFORMANCE: "1"
        run: |-
          hatch run testing:python -m pytest -v -p no:cacheprovider tests/conformance
