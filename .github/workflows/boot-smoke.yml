---
name: "V-PROGRAM boot smoke (plain QEMU)"

# Boots the measured v-program image under plain QEMU on a KVM-capable
# runner (no SEV-SNP) and runs nix/boot-smoke.sh: verity chain, firewall,
# workload handoff, and the aleph_local=1 plain-HTTP agent path that
# `aleph vprogram run` relies on. Same trigger surface as the golden
# measurement check: the image build is the expensive part (~20 min cold).

on:
  workflow_dispatch:
  push:
    # 'dev*' rather than a single dev branch: release lines live on numbered
    # dev branches (dev-2.1 and later) and must carry the smoke too.
    branches: [main, 'dev*']
    paths:
      - "nix/**"
      - "rust/Cargo.toml"
      - "rust/crates/aleph-attest-agent/**"
      - "rust/crates/aleph-tee/**"
      - ".github/workflows/boot-smoke.yml"
  pull_request:
    branches: [main, 'dev*', od/**]
    paths:
      - "nix/**"
      - "rust/Cargo.toml"
      - "rust/crates/aleph-attest-agent/**"
      - "rust/crates/aleph-tee/**"
      - ".github/workflows/boot-smoke.yml"


jobs:
  boot-smoke:
    name: "build image, boot under plain QEMU, probe local mode"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Enable KVM for the runner user
        # GitHub-hosted x86_64 Linux runners expose /dev/kvm to root only;
        # this udev rule (the documented Android-emulator recipe) opens it.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and the phase 2/3 host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 cryptsetup-bin e2fsprogs curl python3
          qemu-system-x86_64 --version | head -1

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run the boot smoke
        run: ./nix/boot-smoke.sh
