---
name: "Golden SEV-SNP measurements"

# Rebuilds the measured boot chain (OVMF + kernel + initrd + cmdline) from
# nix/flake.nix and verifies the launch measurements still match the
# committed nix/golden-measurements.json. Deliberately NOT wired into every
# build: a cold runner compiles the whole chain (edk2, the guest kernel, the
# static-musl attest-agent), about 20 minutes on a 4-vCPU runner since the
# kernel became a whitelist config (nix/kernel-config.fragment); it was
# 2h20m on nixpkgs' distro config. Trigger surface instead:
#   - PRs and dev*/main pushes touching the measured inputs
#   - a weekly cron, which catches reproducibility drift with unchanged
#     inputs (the flake is fully pinned, so any diff on cron is drift)
#   - manual dispatch

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  push:
    branches: [main, 'dev*']
    paths:
      - "nix/**"
      # The initrd bakes the attest-agent binary. Its measured input set is
      # the agent workspace (own Cargo.lock), aleph-tee (path dependency) and
      # the root Cargo.toml (aleph-tee inherits [workspace.dependencies]
      # versions from it). Nothing else under rust/ reaches the measurement
      # since the initrd holds file content only (initrd.nix); the weekly
      # cron backstops anything this filter misses.
      - "rust/Cargo.toml"
      - "rust/crates/aleph-attest-agent/**"
      - "rust/crates/aleph-tee/**"
      - ".github/workflows/golden-measurements.yml"
  pull_request:
    # od/** covers stacked PRs (increment N+1 based on increment N's
    # branch), which must carry CI before the stack lands on a dev branch.
    branches: [main, 'dev*', od/**]
    paths:
      - "nix/**"
      # The initrd bakes the attest-agent binary. Its measured input set is
      # the agent workspace (own Cargo.lock), aleph-tee (path dependency) and
      # the root Cargo.toml (aleph-tee inherits [workspace.dependencies]
      # versions from it). Nothing else under rust/ reaches the measurement
      # since the initrd holds file content only (initrd.nix); the weekly
      # cron backstops anything this filter misses.
      - "rust/Cargo.toml"
      - "rust/crates/aleph-attest-agent/**"
      - "rust/crates/aleph-tee/**"
      - ".github/workflows/golden-measurements.yml"


jobs:
  golden-measurements:
    name: "build measured boot chain, compare launch measurements"
    runs-on: ubuntu-24.04
    # ~20 min cold (run 33110775509: 19m25s); 3x headroom for a slow runner.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: check-golden-measurements.sh names the commit that
          # last touched the golden file on divergence, which a depth-1
          # checkout (only the synthetic merge commit) cannot resolve.
          fetch-depth: 0

      - name: Free runner disk space
        # The nix store for a full chain build (edk2, kernel, rust
        # toolchain, static openssl) does not fit next to the runner
        # image's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No nix store caching on purpose: the store for this build is several
      # GB and the repo's 10 GB Actions cache budget is already spent on the
      # integration-test caches (PR 978); evicting those on a weekly job is
      # a bad trade. Revisit with a real binary cache if this job's runtime
      # becomes a problem.
      - name: Check launch measurements against the golden file
        run: ./nix/check-golden-measurements.sh
