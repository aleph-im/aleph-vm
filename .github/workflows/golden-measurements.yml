---
name: "Golden SEV-SNP measurements"

# Rebuilds the measured boot chain (OVMF + kernel + initrd + cmdline) from
# nix/flake.nix and verifies the launch measurements still match the
# committed nix/golden-measurements.json. Deliberately NOT wired into every
# build: a cold runner compiles the whole chain (edk2, the guest kernel, the
# static-musl attest-agent), about 20 minutes on a 4-vCPU runner since the
# kernel became a whitelist config (nix/kernel-config.fragment); it was
# 2h20m on nixpkgs' distro config. Trigger surface instead:
#   - PRs and dev*/main pushes touching the measured inputs
#   - a weekly cron, which catches reproducibility drift with unchanged
#     inputs (the flake is fully pinned, so any diff on cron is drift)
#   - manual dispatch

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  push:
    branches: [main, 'dev*']
    paths:
      - "nix/**"
      # The initrd bakes the attest-agent binary. Its measured input set is
      # the agent workspace (own Cargo.lock), aleph-tee (path dependency) and
      # the root Cargo.toml (aleph-tee inherits [workspace.dependencies]
      # versions from it). Nothing else under rust/ reaches the measurement
      # since the initrd holds file content only (initrd.nix); the weekly
      # cron backstops anything this filter misses.
      - "rust/Cargo.toml"
      - "rust/crates/aleph-attest-agent/**"
      - "rust/crates/aleph-tee/**"
      - ".github/workflows/golden-measurements.yml"
  pull_request:
    # od/** covers stacked PRs (increment N+1 based on increment N's
    # branch), which must carry CI before the stack lands on a dev branch.
    branches: [main, 'dev*', od/**]
    paths:
      - "nix/**"
      # The initrd bakes the attest-agent binary. Its measured input set is
      # the agent workspace (own Cargo.lock), aleph-tee (path dependency) and
      # the root Cargo.toml (aleph-tee inherits [workspace.dependencies]
      # versions from it). Nothing else under rust/ reaches the measurement
      # since the initrd holds file content only (initrd.nix); the weekly
      # cron backstops anything this filter misses.
      - "rust/Cargo.toml"
      - "rust/crates/aleph-attest-agent/**"
      - "rust/crates/aleph-tee/**"
      - ".github/workflows/golden-measurements.yml"


jobs:
  golden-measurements:
    name: "build measured boot chain, compare launch measurements"
    runs-on: ubuntu-24.04
    # ~20 min cold for the BASE set (run 33110775509: 19m25s, measured before
    # the flavor split); 3x headroom for a slow runner. The confidential-GPU
    # flavor is a separate job below, so it does not eat this budget.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: check-golden-measurements.sh names the commit that
          # last touched the golden file on divergence, which a depth-1
          # checkout (only the synthetic merge commit) cannot resolve.
          fetch-depth: 0

      - name: Free runner disk space
        # The nix store for a full chain build (edk2, kernel, rust
        # toolchain, static openssl) does not fit next to the runner
        # image's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No nix store caching on purpose: the store for this build is several
      # GB and the repo's 10 GB Actions cache budget is already spent on the
      # integration-test caches (PR 978); evicting those on a weekly job is
      # a bad trade. Revisit with a real binary cache if this job's runtime
      # becomes a problem.
      - name: Check launch measurements against the golden file
        run: ./nix/check-golden-measurements.sh --base-only

  # Confidential-GPU flavor. Its chain shares almost nothing with the base
  # set: a second guest kernel (gpuKernel), the NVIDIA open kernel modules,
  # the raw driver userland extracted from the .run archive, and nvat (a CMake
  # build with a vendored Rust sub-build). Runtime is UNMEASURED until this
  # job's first run; the timeout below is a guess with room to spare and
  # should be tightened once there is a real number.
  #
  # Gated so it only runs when it can actually move: always on schedule and
  # manual dispatch, and on push/pull_request only when a GPU input changed.
  golden-measurements-gpu:
    name: "build the confidential-GPU chain, compare its launch measurement"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the gate below diffs against the PR base or the
          # push's previous revision, and the divergence message names the
          # commit that last touched the golden file.
          fetch-depth: 0

      - name: Decide whether the GPU chain needs rebuilding
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "GPU chain: always built on $EVENT_NAME."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A branch's first push has an all-zero "before" and a force-push can
          # leave an unreachable one. Build rather than guess.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "GPU chain: no usable base revision; building to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Inputs that can move gpuMeasurement: the GPU-only files, plus the
          # shared ones the GPU chain also builds from (flake, lock, kernel
          # recipe, initrd recipe, init-common.sh) and the golden file itself.
          gpu_inputs="
          nix/nvidia.nix
          nix/nvat.nix
          nix/gpu-rootfs.nix
          nix/init-gpu.sh
          nix/kernel-config-gpu.fragment
          nix/regorus-ffi-Cargo.lock
          nix/golden-measurements.json
          nix/flake.nix
          nix/flake.lock
          nix/kernel.nix
          nix/initrd.nix
          nix/init-common.sh
          "
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "Changed files:"
          echo "$changed"
          for f in $gpu_inputs; do
            if echo "$changed" | grep -qxF "$f"; then
              echo "GPU chain: $f changed."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "GPU chain: no GPU input changed; skipping."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Free runner disk space
        if: steps.gate.outputs.run == 'true'
        # Same reasoning as the base job, and the GPU chain needs more: the
        # driver userland alone is several hundred MB.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: cachix/install-nix-action@v31
        if: steps.gate.outputs.run == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the GPU launch measurement against the golden file
        if: steps.gate.outputs.run == 'true'
        run: ./nix/check-golden-measurements.sh --gpu-only
