---
name: "Golden SEV-SNP measurements"

# Rebuilds the measured boot chain (OVMF + kernel + initrd + cmdline) from
# nix/flake.nix and verifies the launch measurements still match the
# committed nix/golden-measurements.json. Deliberately NOT wired into every
# build: a cold runner compiles the whole chain (edk2, the guest kernel, the
# static-musl attest-agent), about 20 minutes on a 4-vCPU runner since the
# kernel became a whitelist config (nix/kernel-config.fragment); it was
# 2h20m on nixpkgs' distro config. Trigger surface instead:
#   - PRs and dev*/main pushes touching the measured inputs
#   - a weekly cron, which catches reproducibility drift with unchanged
#     inputs (the flake is fully pinned, so any diff on cron is drift)
#   - manual dispatch

on:
  workflow_dispatch:
    inputs:
      update-goldens:
        description: >-
          Regenerate nix/golden-measurements.json on the dispatched ref and
          commit it there (instead of just checking). Nix is required to build
          the measured boot chain, so this is how a PR that moves a
          measurement gets the file regenerated without a local nix install.
        required: false
        type: boolean
        default: false
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  push:
    branches: [main, 'dev*']
    paths:
      - "nix/**"
      # The initrd bakes the attest-agent binary. Its measured input set is
      # the agent workspace (own Cargo.lock), aleph-tee (path dependency) and
      # the root Cargo.toml (aleph-tee inherits [workspace.dependencies]
      # versions from it). Nothing else under rust/ reaches the measurement
      # since the initrd holds file content only (initrd.nix); the weekly
      # cron backstops anything this filter misses.
      - "rust/Cargo.toml"
      - "rust/crates/aleph-attest-agent/**"
      - "rust/crates/aleph-tee/**"
      - ".github/workflows/golden-measurements.yml"
  pull_request:
    # od/** covers stacked PRs (increment N+1 based on increment N's
    # branch), which must carry CI before the stack lands on a dev branch.
    branches: [main, 'dev*', od/**]
    paths:
      - "nix/**"
      # The initrd bakes the attest-agent binary. Its measured input set is
      # the agent workspace (own Cargo.lock), aleph-tee (path dependency) and
      # the root Cargo.toml (aleph-tee inherits [workspace.dependencies]
      # versions from it). Nothing else under rust/ reaches the measurement
      # since the initrd holds file content only (initrd.nix); the weekly
      # cron backstops anything this filter misses.
      - "rust/Cargo.toml"
      - "rust/crates/aleph-attest-agent/**"
      - "rust/crates/aleph-tee/**"
      - ".github/workflows/golden-measurements.yml"


jobs:
  golden-measurements:
    name: "build measured boot chain, compare launch measurements"
    runs-on: ubuntu-24.04
    # ~20 min cold for the BASE set (run 33110775509: 19m25s, measured before
    # the flavor split); 3x headroom for a slow runner. The confidential-GPU
    # flavor is a separate job below, so it does not eat this budget.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: check-golden-measurements.sh names the commit that
          # last touched the golden file on divergence, which a depth-1
          # checkout (only the synthetic merge commit) cannot resolve.
          fetch-depth: 0

      - name: Free runner disk space
        # The nix store for a full chain build (edk2, kernel, rust
        # toolchain, static openssl) does not fit next to the runner
        # image's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No nix store caching on purpose: the store for this build is several
      # GB and the repo's 10 GB Actions cache budget is already spent on the
      # integration-test caches (PR 978); evicting those on a weekly job is
      # a bad trade. Revisit with a real binary cache if this job's runtime
      # becomes a problem.
      - name: Check launch measurements against the golden file
        run: ./nix/check-golden-measurements.sh --base-only

  # Manual golden regeneration (workflow_dispatch with update-goldens=true).
  # check-golden-measurements.sh --update rebuilds EVERY flavor -- including the
  # confidential-GPU one, whose chain adds about half an hour on top of the base
  # set's ~15 minutes -- so this job carries its own (larger) disk and time
  # budget, and commits the regenerated file straight back to the dispatched
  # branch. That is the documented procedure (check-golden-measurements.sh
  # header) made runnable from CI: whoever moves a measurement regenerates the
  # golden file in the same PR, without a local nix install. Two caveats:
  #   - dispatching a workflow needs write access to this repo, so a fork-PR
  #     contributor asks a maintainer (or runs with their token) to dispatch it;
  #   - the GITHUB_TOKEN can only push to a branch of THIS repo, not to a fork
  #     PR branch -- dispatched there, the git push below fails. The workflow
  #     for that case: push the branch here (e.g. same name), dispatch, then
  #     cherry-pick the regeneration commit back into the fork PR branch.
  # A protected dispatch branch rejects the push the same way; use a working
  # branch, not main/dev*.
  golden-measurements-update:
    name: "regenerate the golden file, commit it to the dispatched ref"
    if: ${{ inputs.update-goldens == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: check-golden-measurements.sh names the commit that
          # last touched the golden file on divergence.
          fetch-depth: 0

      - name: Free runner disk space
        # The nix store for BOTH chains (base + GPU: edk2, two guest kernels,
        # the NVIDIA open modules, the driver userland, nvat, the rust
        # toolchain, static openssl) does not fit next to the runner image's
        # preinstalled toolchains, so prune deeper than the check jobs do.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/lib/node_modules
          sudo docker image prune -af >/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No nix store caching on purpose: the store for this build is several GB
      # and the repo's 10 GB Actions cache budget is already spent on the
      # integration-test caches (PR 978). Revisit with a real binary cache if
      # this job's runtime becomes a problem.
      - name: Regenerate nix/golden-measurements.json
        run: ./nix/check-golden-measurements.sh --update

      - name: Commit the regenerated golden file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/golden-measurements.json
          if git diff --cached --quiet; then
            echo "Golden file already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "chore(nix): regenerate the golden launch measurements"
          # actions/checkout leaves a detached HEAD, so a bare push has no
          # branch to push to; name the dispatched branch explicitly.
          git push origin HEAD:"$GITHUB_REF_NAME"

  # Confidential-GPU flavor. Its chain shares almost nothing with the base
  # set: a second guest kernel (gpuKernel), the NVIDIA open kernel modules,
  # the raw driver userland extracted from the .run archive, and nvat (a CMake
  # build with a vendored Rust sub-build). Runtime is UNMEASURED until this
  # job's first run; the timeout below is a guess with room to spare and
  # should be tightened once there is a real number.
  #
  # Gated so it only runs when it can actually move: always on schedule and
  # manual dispatch, and on push/pull_request only when a GPU input changed.
  golden-measurements-gpu:
    name: "build the confidential-GPU chain, compare its launch measurement"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the gate below diffs against the PR base or the
          # push's previous revision, and the divergence message names the
          # commit that last touched the golden file.
          fetch-depth: 0

      - name: Decide whether the GPU chain needs rebuilding
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "GPU chain: always built on $EVENT_NAME."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A branch's first push has an all-zero "before" and a force-push can
          # leave an unreachable one. Build rather than guess.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "GPU chain: no usable base revision; building to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Inputs that can move gpuMeasurement: the GPU-only files, the
          # shared ones the GPU chain also builds from (flake, lock, OVMF,
          # kernel recipe and base fragment, initrd recipe and every script
          # it ships), the attest-agent's measured source set (the same one
          # the trigger paths above name) and the golden file itself, plus
          # what this job runs: the check script, the smoke script and this
          # workflow. An entry with a trailing slash matches everything
          # under it.
          gpu_inputs="
          .github/workflows/golden-measurements.yml
          nix/check-golden-measurements.sh
          nix/boot-smoke.sh
          nix/nvidia.nix
          nix/nvat.nix
          nix/gpu-rootfs.nix
          nix/init-gpu.sh
          nix/kernel-config-gpu.fragment
          nix/regorus-ffi-Cargo.lock
          nix/golden-measurements.json
          nix/flake.nix
          nix/flake.lock
          nix/ovmf.nix
          nix/kernel.nix
          nix/kernel-config.fragment
          nix/initrd.nix
          nix/init-common.sh
          nix/udhcpc.script
          nix/udhcpc6.script
          rust/Cargo.toml
          rust/crates/aleph-attest-agent/
          rust/crates/aleph-tee/
          "
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "Changed files:"
          echo "$changed"
          for f in $gpu_inputs; do
            case "$f" in
              */) hit="$(echo "$changed" | grep -c "^$f" || true)" ;;
              *) hit="$(echo "$changed" | grep -cxF "$f" || true)" ;;
            esac
            if [ "$hit" -gt 0 ]; then
              echo "GPU chain: $f changed."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "GPU chain: no GPU input changed; skipping."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Free runner disk space
        if: steps.gate.outputs.run == 'true'
        # Same reasoning as the base job, and the GPU chain needs more: the
        # driver userland alone is several hundred MB.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: cachix/install-nix-action@v31
        if: steps.gate.outputs.run == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the GPU launch measurement against the golden file
        if: steps.gate.outputs.run == 'true'
        run: ./nix/check-golden-measurements.sh --gpu-only

      # The GPU image is in this runner's store now, so booting it costs a
      # QEMU install and a couple of minutes. This is the only CI coverage
      # init-gpu.sh gets: it must verify its rootfs and then power off,
      # since a GPU runtime with no card fails closed. The GPU stage itself
      # needs real hardware.
      - name: Enable KVM for the runner user
        if: steps.gate.outputs.run == 'true'
        # Same recipe as boot-smoke.yml: GitHub-hosted x86_64 runners expose
        # /dev/kvm to root only.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          qemu-system-x86_64 --version | head -1

      - name: Boot the GPU image without a GPU and check it refuses
        if: steps.gate.outputs.run == 'true'
        run: ./nix/boot-smoke.sh --gpu
