---
name: Publish aleph-tee

# Tag `aleph-tee-vX.Y.Z` on a commit whose rust/crates/aleph-tee/Cargo.toml
# says version X.Y.Z. The first release of the crate has to be pushed by a
# person with an API token (crates.io lets an owner configure trusted
# publishing only once the crate exists); every later release goes through
# this workflow with no long-lived secret, via crates.io trusted publishing
# (GitHub OIDC). Configure it on crates.io under the crate's settings:
# repository aleph-im/aleph-vm, workflow publish-aleph-tee.yml.
on:
  push:
    tags:
      - "aleph-tee-v*"


permissions:
  contents: read


jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The OIDC token crates.io exchanges for a publish token: scoped to
      # this job, which is the only one that needs it.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup show

      - name: Check the tag matches the manifest version
        working-directory: rust
        run: |
          tag_version="${GITHUB_REF_NAME#aleph-tee-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "aleph-tee") | .version')"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "tag says $tag_version, Cargo.toml says $manifest_version" >&2
            exit 1
          fi

      # A tag push does not run test-rust.yml, so the release gate is here:
      # the crate's suite on the tagged commit, then the packaging dry run.
      - name: Test the crate
        working-directory: rust
        run: |
          cargo test --locked -p aleph-tee
          cargo publish --locked --dry-run -p aleph-tee

      - name: Authenticate with crates.io
        id: auth
        # Pinned to the commit behind v1.0.5: this step holds the OIDC token.
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish
        working-directory: rust
        run: cargo publish --locked -p aleph-tee
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
