[build-system]
build-backend = "hatchling.build"

requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "aleph-vm"
description = "Aleph.im VM execution engine"
readme = "README.md"
keywords = [  ]
license = { file = "LICENSE" }
authors = [
  { name = "Hugo Herter", email = "git@hugoherter.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: aiohttp",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]
dynamic = [ "version" ]

# Upon adding or updating dependencies, update `packaging/Makefile` for the Debian package
dependencies = [
  "aiodns==3.1",
  "aiohttp==3.10.11",
  "aiohttp-cors~=0.7.0",
  "aiosqlite==0.19",
  "alembic==1.13.1",
  # MERGE GATE: replace the git pin with a released aleph-message version (V-PROGRAM schema, PR #158)
  "aleph-message @ git+https://github.com/aleph-im/aleph-message@4ad261ff25f595a64589d49bf36f514c402e7c5e",
  "aleph-superfluid~=0.2.1",
  "eth-account~=0.10",
  "grpcio>=1.70,<1.71",                                                                                     # generated _pb2_grpc.py embeds GRPC_GENERATED_VERSION=1.70.0; older installs RuntimeError on import
  "jsonschema==4.19.1",
  "jwcrypto==1.5.6",
  "msgpack==1.1.2",
  "packaging>=23.2",
  # Fixing this protobuf dependency version to avoid getting CI errors as version 5.29.0 have this compilation issue
  "protobuf==5.29.6",
  "psutil==5.9.5",
  "py-cpuinfo==9",
  "pydantic>=2,<3",
  "pydantic-settings~=2.6.1",
  "python-dotenv~=1.1.0",
  "pyyaml==6.0.1",
  "redis>=4.2",
  "schedule==1.2.1",
  "sentry-sdk==2.8",
  "setproctitle==1.3.3",
  "sev-snp-measure==0.0.12",
  "solathon==1.0.7",
  "sqlalchemy[asyncio]>=2",
  "systemd-python==235",
]

urls.Discussions = "https://community.aleph.im/"
urls.Documentation = "https://docs.aleph.cloud/nodes/compute/introduction/"
urls.Issues = "https://github.com/aleph-im/aleph-vm/issues"
urls.Source = "https://github.com/aleph-im/aleph-vm"
scripts.aleph-vm = "aleph.vm.agent.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = [ "src/aleph" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.default]
platforms = [ "linux" ]

[tool.hatch.envs.default.scripts]
# The aleph-vm console script (aleph.vm.agent.cli:main) is a flat argparse
# CLI, no subcommands; the supervisor daemon is the Rust binary under rust/.
agent = "aleph-vm {args:--help}"
config = "aleph-vm --print-settings --do-not-run {args}"

[tool.hatch.envs.testing]
type = "virtual"
system-packages = true
dependencies = [
  "eth_typing==4.3.1",        # Temp fix for bug in CI with 5.0.0
  "grpcio-tools>=1.70,<1.71", # matches grpcio runtime range; 1.71+ requires protobuf 6.x, we pin protobuf==5.29.6
  "mypy-protobuf>=3.6,<4",    # 4.x+ requires protobuf 6.x; we pin protobuf==5.29.6
  "pytest==8.2.1",
  "pytest-cov==5.0.0",
  "pytest-mock==3.14.0",
  "pytest-asyncio==0.23.7",
  "pytest-aiohttp==1.0.5",
  "import-linter>=2,<3",      # enforces the agent/supervisor/contract import boundary
]
[tool.hatch.envs.testing.scripts]
test = "pytest {args:tests}"
imports = "lint-imports"
test-cov = "pytest --durations=10 --cov  {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = [ "3.10", "3.11", "3.12" ]

[tool.hatch.envs.linting]
detached = true
dependencies = [
  "mypy==1.8.0",
  "ruff==0.4.6",
  "isort==5.13.2",
  "yamlfix==1.17.0",
  "pyproject-fmt==2.2.1",
  "pydantic>=2,<3",
]
[tool.hatch.envs.linting.scripts]
typing = "mypy {args:src/aleph/vm/ tests/ examples/example_fastapi runtimes/aleph-debian-12-python}"
# Check
style = [
  "ruff format --diff {args:.}",
  "isort --check-only --profile black {args:.}",
  "yamlfix --check .",
  "pyproject-fmt --check pyproject.toml",
]
# Do modification
fmt = [
  "ruff format {args:.}",
  "isort --profile black {args:.}",
  "yamlfix .",
  "pyproject-fmt pyproject.toml",
  "style",
]
all = [
  "style",
  "typing",
]

[tool.black]
target-version = [ "py310" ]
line-length = 120
#skip-string-normalization = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = [ "src" ]
extend-exclude = [ "src/aleph/vm/supervisor_interface/wire/_pb" ]
lint.select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "ISC001",
  # https://docs.astral.sh/ruff/rules/single-line-implicit-string-concatenation/#single-line-implicit-string-concatenation-isc001
  #  # Allow non-abstract empty methods in abstract base classes
  #  "B027",
  #  # Allow boolean positional values in function calls, like `dict.get(... True)`
  #  "FBT003",
  #  # Ignore checks for possible passwords
  #  "S105", "S106", "S107",
  #  # Ignore complexity
  #  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
  # Allow the use of assert statements
  "S101",
]
#[tool.ruff.flake8-tidy-imports]
#ban-relative-imports = "all"
#unfixable = [
#  # Don't touch unused imports
#  "F401",
#]

# Tests can use magic values, assertions, and relative imports
lint.per-file-ignores."tests/**/*" = [ "PLR2004", "S101", "TID252" ]

[tool.isort]
profile = "black"
extra_standard_library = [ "packaging" ]
skip_glob = [ "src/aleph/vm/supervisor_interface/wire/_pb/*" ]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]
norecursedirs = [
  "runtimes/aleph-debian-11-python/rootfs/",
  "runtimes/aleph-debian-12-python/rootfs/",
]

[tool.coverage.run]
source_pkgs = [ "aleph.vm", "tests" ]
branch = true
parallel = true
omit = [
  "src/aleph/vm/__about__.py",
  # Generated protobuf bindings: descriptor code that does not run under the
  # default C++ descriptors, so it is not meaningfully testable. Already
  # excluded from mypy (see [tool.mypy] exclude below).
  "src/aleph/vm/supervisor_interface/wire/_pb/*",
  "*/supervisor_interface/wire/_pb/*",
  # Conformance tests drive the Rust daemon: they only run in the Rust CI
  # job (opt-in via ALEPH_VM_CONFORMANCE=1), which uploads no coverage, so
  # counting them here only skews the coverage totals.
  "tests/conformance/*",
  # Same shape: the integration suite needs root and KVM, so it runs in its
  # own CI job, which uploads no coverage; the coverage-measured unit-test
  # job only imports these files and skips every test.
  "tests/integration/*",
]

[tool.coverage.paths]
aleph_vm = [ "src/aleph/vm", "*/aleph-vm/src/aleph/vm" ]
tests = [ "tests", "*/aleph-vm/tests" ]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
install_types = true
non_interactive = true
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
exclude = [ "src/aleph/vm/supervisor_interface/wire/_pb/" ]

[tool.yamlfix]
sequence_style = "keep_style"
preserve_quotes = true
whitelines = 1
section_whitelines = 2

[tool.importlinter]
root_package = "aleph"
# Grimp counts TYPE_CHECKING and function-level imports too, so type-only and
# lazy edges also appear here. The supervisor side of the process split is the
# Rust daemon (rust/crates/supervisor-daemon); the Python tree holds the agent
# and the contract it dials the daemon with, and the contract must stay free of
# agent code so the wire types keep meaning the same thing on both ends.

[[tool.importlinter.contracts]]
name = "supervisor_interface (contract + wire + client) does not depend on the agent"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [ "aleph.vm.supervisor_interface" ]
forbidden_modules = [ "aleph.vm.agent" ]
