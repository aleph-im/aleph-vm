# Aleph-VM runs many micro-VMs per host (target: 1000+). Each program VM's
# guest API spawns inotify watchers (one per resolver channel), so raise the
# per-user limits to avoid "Too many open files" / "Failed to allocate
# directory watch" on busy hosts.
fs.inotify.max_user_instances=8192
fs.inotify.max_user_watches=1048576
